{% extends "base.html" %}{% block title %}{{ heading }} | FastNeural{% endblock %}{% block content %}<header class="page-head"><p class="eyebrow">{{ endpoint }}</p><h1>{{ heading }}</h1><p class="micro">{{ micro }}</p></header><section class="panel operation"><form hx-post="/panel/operation/{{ operation }}" hx-target="#result" hx-swap="innerHTML" hx-encoding="multipart/form-data" class="operation-form"><label>{{ label }}{% if operation=='business-health' %}<input type="hidden" name="text" value=""><span class="muted">Consulta el estado de los modelos empresariales.</span>{% elif upload %}<input type="file" name="file" accept="{{ upload }}" required>{% else %}<textarea name="text" rows="8" placeholder="Escribe aquí..." required></textarea>{% endif %}</label>{% if categories %}<label>Categorías (separadas por coma)<input name="categories" placeholder="soporte, ventas, urgente" required></label>{% endif %}{% if operation=='translate' %}<div class="two"><label>Origen<select name="source_lang"><option>es</option><option>en</option></select></label><label>Destino<select name="target_lang"><option>en</option><option>es</option></select></label></div>{% endif %}<button class="primary" type="submit">Ejecutar <span class="htmx-indicator">...</span></button></form><div id="result">{% include 'result.html' %}</div></section>{% endblock %}
