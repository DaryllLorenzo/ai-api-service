{% extends "base.html" %}{% block title %}Test API | FastNeural{% endblock %}{% block content %}<div class="page-head"><div><p class="eyebrow">DEVELOPER TOOLS</p><h1>Test the API</h1></div></div><section class="panel"><form method="post" action="/panel/test" enctype="multipart/form-data"><label>Endpoint<select name="endpoint"><option value="health">Health check</option><option value="chat">Chat generation</option><option value="transcribe">Audio transcription</option><option value="ocr">OCR image</option><option value="embeddings">Embeddings</option></select></label><label>Text input<textarea name="text" rows="5" placeholder="Enter text for chat or embeddings"></textarea></label><label>Upload file<input name="file" type="file" accept="audio/*,image/*"></label><button class="primary" type="submit">Run request</button></form>{% if result %}<pre class="result">{{ result | tojson(indent=2) }}</pre>{% endif %}</section>{% endblock %}
