services:
  api:
    build: .
    container_name: ai_api_service
    ports:
      - "8000:8000"
    volumes:
      # Modelos LLM/Whisper (persisten entre rebuilds)
      - ./data/models:/app/data/models
      # Cache de modelos auto-descargados (Whisper, Embeddings, etc.)
      - model-cache:/root/.cache
      # Configuracion sin rebuild
      - ./.env:/app/.env:ro
      # Hot reload (descomentar para desarrollo)
      # - ./app:/app/app
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          memory: 4G

volumes:
  model-cache:
