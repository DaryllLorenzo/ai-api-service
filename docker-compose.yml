services:
  api:
    build: .
    container_name: fastneural
    ports:
      - "8000:8000"
    volumes:
      # Data completa (modelos + DB de API keys)
      - ./data:/app/data
      # Cache de modelos auto-descargados
      - model-cache:/root/.cache
      # Configuracion sin rebuild
      - ./.env:/app/.env:ro
      # Hot reload (descomentar para desarrollo)
      # - ./app:/app/app
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          memory: 4G

volumes:
  model-cache:
